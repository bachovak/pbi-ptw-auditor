name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# ------------------------------------------------------------------------------
# Future: Scheduled exposure-audit workflow
# When you are ready to add automated recurring audits (e.g. nightly snapshot +
# diff against the previous run to surface newly-published reports), add a second
# workflow here triggered by `schedule: - cron: '0 6 * * *'`. It would:
#   1. Run pbi-ptw-auditor with service-principal auth (credentials in Actions secrets).
#   2. Commit the timestamped JSON output to a `snapshots/` branch.
#   3. Diff the new snapshot against the previous one and open a GitHub issue (or
#      post to Slack/Teams) if new public reports appear.
# Do NOT build this yet — placeholder only.
# ------------------------------------------------------------------------------

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest --tb=short -q
