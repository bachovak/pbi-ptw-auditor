[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pbi-ptw-auditor"
version = "0.2.0"
description = "Inventory Power BI reports published to the open web via the Power BI Admin REST API"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kristina Bachová", email = "bachovak@gmail.com" }]
keywords = ["power-bi", "security", "audit", "governance", "publish-to-web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "msal>=1.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "click>=8.1",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
pbi-ptw-auditor = "pbi_ptw_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/bachovak/pbi-ptw-auditor"
Repository = "https://github.com/bachovak/pbi-ptw-auditor"
"Bug Tracker" = "https://github.com/bachovak/pbi-ptw-auditor/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
